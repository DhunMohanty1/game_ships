<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  />
  <title>Sea of Tides</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87cfff;
    }

    canvas {
      display: block;
    }

    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 22px;
      color: white;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
      transition: opacity 0.8s ease;
    }

    #title {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    #hint {
      margin-top: 8px;
      font-size: 14px;
      opacity: 0.9;
      letter-spacing: 0.08em;
    }

    #tip {
      position: fixed;
      left: 18px;
      bottom: 14px;
      color: white;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      opacity: 0.85;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="title">Sea of Tides</div>
    <div id="hint">Press W to begin sailing</div>
  </div>
  <div id="tip">W/S: accelerate / brake • A/D: steer • Space: anchor</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
